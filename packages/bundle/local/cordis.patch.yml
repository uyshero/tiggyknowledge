- insert:
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'

    - id: knowledge-catalog
      name: '@tiggyknowledge/catalog-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: knowledge-content
      name: '@tiggyknowledge/content-local'
      config:
        dataDir: !!js ctx.dataRoot

    - id: knowledge-metadata-store
      name: '@tiggyknowledge/metadata-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: chat-storage
      name: '@tiggyknowledge/chat-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: text-producer
      name: '@tiggyknowledge/producer-text'

    - id: pdf-producer
      name: '@tiggyknowledge/producer-pdf'

    - id: basic-chunker
      name: '@tiggyknowledge/chunker-basic'

    - id: fts-index
      name: '@tiggyknowledge/index-fts'
      config:
        dataDir: !!js ctx.dataRoot

    - id: ingestion
      name: '@tiggyknowledge/ingestion'

    - id: text-preview
      name: '@tiggyknowledge/preview-text'

    - id: pdf-preview
      name: '@tiggyknowledge/preview-pdf'

    - id: knowledge-documents
      name: '@tiggyknowledge/documents'

    - id: document-metadata
      name: '@tiggyknowledge/document-metadata'

    - id: knowledge-graph
      name: '@tiggyknowledge/graph'
      disabled: true

    - id: ingestion-tags
      name: '@tiggyknowledge/ingestion-tags'

    - id: note-creator
      name: '@tiggyknowledge/note-creator'

    - id: knowledge-okf
      name: '@tiggyknowledge/okf'

    - id: okf-export
      name: '@tiggyknowledge/okf-export'

    - id: semantic-capabilities
      name: '@tiggyknowledge/semantic-capabilities'

    - id: http-router
      name: '@tiggyknowledge/http-router'

    - id: wiki-store
      name: '@tiggyknowledge/wiki-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: knowledge-query
      name: '@tiggyknowledge/query'

    - id: settings
      name: '@tiggyknowledge/settings-file'
      config:
        path: !!js ctx.dataRoot + '/settings.yaml'

    - id: llm-credentials
      name: '@tiggyknowledge/llm-credentials'
      config:
        dataDir: !!js ctx.dataRoot

    - id: llm-client
      name: '@tiggyknowledge/llm-client'

    - id: llm-wiki
      name: '@tiggyknowledge/llm-wiki'

    - id: llm-api
      name: '@tiggyknowledge/llm-api'

    - id: library-chat
      name: '@tiggyknowledge/library-chat'

    - id: library-chat-api
      name: '@tiggyknowledge/library-chat-api'

    - id: wiki-governance
      name: '@tiggyknowledge/wiki-governance'
      config:
        dataDir: !!js ctx.dataRoot

    - id: wiki-governance-api
      name: '@tiggyknowledge/wiki-governance-api'

    - id: storage-manager
      name: '@tiggyknowledge/storage-manager'

    - id: client-bootstrap
      name: '@tiggyknowledge/client-bootstrap'
      config:
        plugins:
          - id: client-connection
            moduleName: '@tiggyknowledge/client-connection'
            label: Connection
            description: Host API connection
          - id: client-runtime
            moduleName: '@tiggyknowledge/client-runtime'
            label: Runtime
            description: Page registry and client runtime state
          - id: client-ui-knowledge
            moduleName: '@tiggyknowledge/client-ui-knowledge'
            label: Knowledge
            description: Knowledge library workbench
          - id: client-note-create
            moduleName: '@tiggyknowledge/client-note-create'
            label: Note Creator
            description: Markdown knowledge note creation
          - id: client-ui-ingestion
            moduleName: '@tiggyknowledge/client-ui-ingestion'
            label: Ingestion
            description: Batch upload workbench
          - id: client-ui-documents
            moduleName: '@tiggyknowledge/client-ui-documents'
            label: Documents
            description: Document list and preview workbench
          - id: client-library-chat
            moduleName: '@tiggyknowledge/client-library-chat'
            label: Library Chat
            description: Knowledge library grounded question answering
          - id: client-inspector-okf
            moduleName: '@tiggyknowledge/client-inspector-okf'
            label: OKF Inspector
            description: Runtime OKF concept and source mapping
          - id: client-action-okf-export
            moduleName: '@tiggyknowledge/client-action-okf-export'
            label: OKF Export
            description: Knowledge library OKF Bundle export action
          - id: client-preview-pdf
            moduleName: '@tiggyknowledge/client-preview-pdf'
            label: PDF Preview
            description: Visual PDF page renderer
          - id: client-ui-tags
            moduleName: '@tiggyknowledge/client-ui-tags'
            label: Tags
            description: Tag browser and filtered documents
          - id: client-ui-favorites
            moduleName: '@tiggyknowledge/client-ui-favorites'
            label: Favorites
            description: Favorite documents workbench
          - id: client-ui-search
            moduleName: '@tiggyknowledge/client-ui-search'
            label: Search
            description: Keyword search workbench
          - id: client-ui-wiki
            moduleName: '@tiggyknowledge/client-ui-wiki'
            label: LLM Wiki
            description: Global generated knowledge wiki
          - id: client-wiki-governance
            moduleName: '@tiggyknowledge/client-wiki-governance'
            label: Wiki Governance
            description: Personal wiki versions, issues, lint, and recycle bin
          - id: client-ui-settings
            moduleName: '@tiggyknowledge/client-ui-settings'
            label: Settings
            description: Settings page shell
          - id: client-settings-general
            moduleName: '@tiggyknowledge/client-settings-general'
            label: General Settings
            description: General settings panel
          - id: client-settings-storage
            moduleName: '@tiggyknowledge/client-settings-storage'
            label: Storage Settings
            description: Local storage settings panel
          - id: client-settings-config
            moduleName: '@tiggyknowledge/client-settings-config'
            label: Plugin Configuration
            description: Plugin configuration panel
          - id: client-settings-dsh-integration
            moduleName: '@tiggyknowledge/client-settings-dsh-integration'
            label: 智能体集成
            description: 智能体接入与只读知识库配置
          - id: client-settings-llm
            moduleName: '@tiggyknowledge/client-settings-llm'
            label: AI 模型
            description: OpenAI 兼容模型配置
          - id: client-settings-plugins
            moduleName: '@tiggyknowledge/client-settings-plugins'
            label: Plugin Inventory
            description: Plugin inventory settings panel
          - id: client-ui-layout
            moduleName: '@tiggyknowledge/client-ui-layout'
            label: Layout
            description: Application shell and React renderer

    - id: plugin-inventory
      name: '@tiggyknowledge/plugin-inventory'

    - id: webserver
      name: '@tiggyknowledge/webserver'
      config:
        host: 127.0.0.1
        port: !!js ctx.webPort
        distRoot: !!js ctx.webDistRoot

- insert:
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'

    - id: knowledge-catalog
      name: '@tiggyknowledge/catalog-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: knowledge-content
      name: '@tiggyknowledge/content-local'
      config:
        dataDir: !!js ctx.dataRoot

    - id: knowledge-metadata-store
      name: '@tiggyknowledge/metadata-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: chat-storage
      name: '@tiggyknowledge/chat-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: text-producer
      name: '@tiggyknowledge/producer-text'

    - id: pdf-producer
      name: '@tiggyknowledge/producer-pdf'

    - id: url-producer
      name: '@tiggyknowledge/producer-url'

    - id: basic-chunker
      name: '@tiggyknowledge/chunker-basic'

    - id: fts-index
      name: '@tiggyknowledge/index-fts'
      config:
        dataDir: !!js ctx.dataRoot

    - id: ingestion
      name: '@tiggyknowledge/ingestion'

    - id: text-preview
      name: '@tiggyknowledge/preview-text'

    - id: pdf-preview
      name: '@tiggyknowledge/preview-pdf'

    - id: url-preview
      name: '@tiggyknowledge/preview-url'

    - id: audio-preview
      name: '@tiggyknowledge/preview-audio'

    - id: knowledge-documents
      name: '@tiggyknowledge/documents'

    - id: document-metadata
      name: '@tiggyknowledge/document-metadata'

    - id: knowledge-graph
      name: '@tiggyknowledge/graph'
      disabled: true

    - id: ingestion-tags
      name: '@tiggyknowledge/ingestion-tags'

    - id: note-creator
      name: '@tiggyknowledge/note-creator'

    - id: url-creator
      name: '@tiggyknowledge/url-creator'

    - id: knowledge-okf
      name: '@tiggyknowledge/okf'

    - id: okf-export
      name: '@tiggyknowledge/okf-export'

    - id: semantic-capabilities
      name: '@tiggyknowledge/semantic-capabilities'

    - id: http-router
      name: '@tiggyknowledge/http-router'

    - id: wiki-store
      name: '@tiggyknowledge/wiki-sqlite'
      config:
        dataDir: !!js ctx.dataRoot

    - id: knowledge-query
      name: '@tiggyknowledge/query'

    - id: settings
      name: '@tiggyknowledge/settings-file'
      config:
        path: !!js ctx.dataRoot + '/settings.yaml'

    - id: llm-credentials
      name: '@tiggyknowledge/llm-credentials'
      config:
        dataDir: !!js ctx.dataRoot

    - id: llm-client
      name: '@tiggyknowledge/llm-client'

    - id: studio
      name: '@tiggyknowledge/studio'

    - id: llm-wiki
      name: '@tiggyknowledge/llm-wiki'

    - id: llm-api
      name: '@tiggyknowledge/llm-api'

    - id: library-chat
      name: '@tiggyknowledge/library-chat'

    - id: wiki-governance
      name: '@tiggyknowledge/wiki-governance'
      config:
        dataDir: !!js ctx.dataRoot

    - id: storage-manager
      name: '@tiggyknowledge/storage-manager'

    - id: client-bootstrap
      name: '@tiggyknowledge/client-bootstrap'
      config:
        plugins:
          - id: client-connection
            moduleName: '@tiggyknowledge/client-connection'
            label: Connection
            description: Host API connection
          - id: client-runtime
            moduleName: '@tiggyknowledge/client-runtime'
            label: Runtime
            description: Page registry and client runtime state
          - id: client-ui-settings
            moduleName: '@tiggyknowledge/client-ui-settings'
            label: Settings
            description: Settings page shell
          - id: client-ui-layout
            moduleName: '@tiggyknowledge/client-ui-layout'
            label: Layout
            description: Application shell and React renderer

    - id: plugin-inventory
      name: '@tiggyknowledge/plugin-inventory'

    - id: external-plugins
      name: '@tiggyknowledge/external-plugins'

    - id: agent-api
      name: '@tiggyknowledge/agent-api'

    - id: webserver
      name: '@tiggyknowledge/webserver'
      config:
        host: 127.0.0.1
        port: !!js ctx.webPort
        distRoot: !!js ctx.webDistRoot

packages:
  - vendor/*
  - packages/*/*
  - apps/*

linkWorkspacePackages: true

overrides:
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  node-addon-require-builtin: false
  tesseract.js: true

minimumReleaseAgeExclude:
  - react-pdf@10.5.0
